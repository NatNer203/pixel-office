
[package]
name = "pixel-office"
version = "0.4.1"
description = "Pixel Office"
authors = ["you"]
edition = "2024"

[lib]
name = "pixel_office_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.43", features = ["bundled"] }

semver = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
